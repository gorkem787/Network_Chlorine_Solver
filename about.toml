# cargo-about configuration: generates THIRD_PARTY_LICENSES.txt
#   cargo about generate about.hbs -o THIRD_PARTY_LICENSES.txt
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# This workspace's own crates are covered by LICENSE; EPANET is listed in the template.
private = { ignore = true }
